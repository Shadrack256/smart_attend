<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard · Smart Attend</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f5bff'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-weight='bold'>S</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    tailwind.config = { theme: { extend: {
        colors: { brand: { 50:'#eef4ff',100:'#dbe7ff',200:'#bcd0ff',300:'#8eb0ff',400:'#5885ff',500:'#2f5bff',600:'#1a3ff0',700:'#152fd0',800:'#182ba8',900:'#1a2b85' } },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
        boxShadow: { card: '0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10)' },
    }}}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

<div class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">

    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Hi, Jane 👋</h1>
            <p class="text-sm text-slate-500 mt-1">Your attendance overview</p>
        </div>
        <div class="flex items-center gap-2">
            <a href="scan.html"
               class="inline-flex items-center gap-2 rounded-lg bg-brand-600 text-white px-4 py-2.5 text-sm font-semibold hover:bg-brand-700 shadow-sm">
                <i data-lucide="qr-code" class="w-4 h-4"></i> Scan QR
            </a>
            <a href="../auth/login.html"
               class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
                Sign out
            </a>
        </div>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">

        <div class="bg-white rounded-xl border border-slate-200 shadow-card p-5">
            <div class="flex items-center justify-between mb-4">
                <span class="inline-flex items-center rounded-md bg-brand-50 text-brand-700 px-2 py-1 text-xs font-semibold font-mono">CSC101</span>
                <span class="text-xs text-slate-400">11/12 sessions</span>
            </div>
            <div class="text-sm font-medium text-slate-900 mb-3">Introduction to Computer Science</div>
            <div class="flex items-center gap-3">
                <div class="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                    <div class="h-full bg-emerald-500" style="width: 91.7%"></div>
                </div>
                <span class="text-sm font-semibold tabular-nums text-emerald-700">91.7%</span>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-card p-5">
            <div class="flex items-center justify-between mb-4">
                <span class="inline-flex items-center rounded-md bg-brand-50 text-brand-700 px-2 py-1 text-xs font-semibold font-mono">CSC201</span>
                <span class="text-xs text-slate-400">7/12 sessions</span>
            </div>
            <div class="text-sm font-medium text-slate-900 mb-3">Data Structures &amp; Algorithms</div>
            <div class="flex items-center gap-3">
                <div class="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                    <div class="h-full bg-amber-500" style="width: 58.3%"></div>
                </div>
                <span class="text-sm font-semibold tabular-nums text-amber-700">58.3%</span>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-card p-5">
            <div class="flex items-center justify-between mb-4">
                <span class="inline-flex items-center rounded-md bg-brand-50 text-brand-700 px-2 py-1 text-xs font-semibold font-mono">MAT101</span>
                <span class="text-xs text-slate-400">12/12 sessions</span>
            </div>
            <div class="text-sm font-medium text-slate-900 mb-3">Calculus I</div>
            <div class="flex items-center gap-3">
                <div class="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                    <div class="h-full bg-emerald-500" style="width: 100%"></div>
                </div>
                <span class="text-sm font-semibold tabular-nums text-emerald-700">100%</span>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-card p-5">
            <div class="flex items-center justify-between mb-4">
                <span class="inline-flex items-center rounded-md bg-brand-50 text-brand-700 px-2 py-1 text-xs font-semibold font-mono">CSC301</span>
                <span class="text-xs text-slate-400">5/12 sessions</span>
            </div>
            <div class="text-sm font-medium text-slate-900 mb-3">Database Systems</div>
            <div class="flex items-center gap-3">
                <div class="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                    <div class="h-full bg-rose-500" style="width: 41.7%"></div>
                </div>
                <span class="text-sm font-semibold tabular-nums text-rose-700">41.7%</span>
            </div>
        </div>

    </div>

</div>
<script>lucide.createIcons();</script>
</body>
</html>
