<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR · Smart Attend</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f5bff'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-weight='bold'>S</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    tailwind.config = { theme: { extend: {
        colors: { brand: { 50:'#eef4ff',100:'#dbe7ff',200:'#bcd0ff',300:'#8eb0ff',400:'#5885ff',500:'#2f5bff',600:'#1a3ff0',700:'#152fd0',800:'#182ba8',900:'#1a2b85' } },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
        boxShadow: { card: '0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10)' },
    }}}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

<div class="max-w-2xl mx-auto p-4 sm:p-6">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Scan QR code</h1>
            <p class="text-sm text-slate-500 mt-1">Point your camera at the lecturer's screen.</p>
        </div>
        <a href="dashboard.html"
           class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
        </a>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-card p-5">

        <div class="mb-4 flex items-center gap-2 text-sm">
            <i data-lucide="map-pin" class="w-4 h-4 text-emerald-600"></i>
            <span class="text-emerald-700">Location ready (±12 m)</span>
        </div>

        <!-- Camera placeholder -->
        <div id="reader" class="relative aspect-square rounded-lg overflow-hidden bg-slate-900 grid place-items-center">
            <div class="text-center text-white/80">
                <i data-lucide="camera" class="w-12 h-12 mx-auto mb-3 opacity-70"></i>
                <div class="text-sm">Camera preview would appear here</div>
                <div class="text-xs text-white/50 mt-1">Requires HTTPS on real devices</div>
            </div>

            <!-- Scan frame overlay -->
            <div class="absolute inset-12 border-2 border-brand-400/60 rounded-lg pointer-events-none"></div>
        </div>

        <!-- Simulate scan button (for demo) -->
        <button onclick="simulateScan()"
                class="mt-4 w-full rounded-lg bg-slate-900 text-white py-2.5 text-sm font-semibold hover:bg-slate-800 transition">
            Simulate successful scan (demo)
        </button>

        <div id="result" class="mt-4"></div>
    </div>

</div>

<script>
    lucide.createIcons();

    function simulateScan() {
        const box = document.getElementById('result');
        box.innerHTML = `
            <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
                <i data-lucide="check-circle-2" class="w-4 h-4 inline mr-1"></i>
                Attendance marked as present! (12 m from class center)
            </div>`;
        lucide.createIcons();
    }
</script>
</body>
</html>
