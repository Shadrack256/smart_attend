<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live QR · Smart Attend</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f5bff'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-weight='bold'>S</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    tailwind.config = { theme: { extend: {
        colors: { brand: { 50:'#eef4ff',100:'#dbe7ff',200:'#bcd0ff',300:'#8eb0ff',400:'#5885ff',500:'#2f5bff',600:'#1a3ff0',700:'#152fd0',800:'#182ba8',900:'#1a2b85' } },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
    }}}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
        .pulse-dot { animation: pulseDot 1.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

<div class="max-w-4xl mx-auto p-6">

    <div class="flex items-center justify-between mb-8">
        <div>
            <div class="text-slate-400 text-sm">Live session · CSC101</div>
            <h1 class="text-2xl font-bold mt-1">Introduction to Computer Science</h1>
        </div>
        <div class="flex items-center gap-2 text-emerald-400 text-sm">
            <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span> Live
        </div>
    </div>

    <div class="grid md:grid-cols-2 gap-8 items-center bg-slate-800 rounded-2xl p-8">

        <div class="bg-white rounded-2xl p-6 flex items-center justify-center">
            <div class="grid grid-cols-11 gap-1">
                <script>
                    // Generate a fake QR pattern for demo
                    let html = '';
                    for (let i = 0; i < 121; i++) {
                        const on = ((i * 7 + i * 3) % 5) < 2;
                        html += `<div class="w-3 h-3 rounded-[2px] ${on ? 'bg-slate-900' : 'bg-slate-200'}"></div>`;
                    }
                    document.write(html);
                </script>
            </div>
        </div>

        <div>
            <h2 class="text-xl font-semibold mb-3">Scan to mark attendance</h2>
            <p class="text-slate-400 text-sm mb-6">
                The QR code refreshes every 20 seconds. Students must be within range to be marked present.
            </p>
            <div class="text-xs uppercase tracking-wide text-slate-500 mb-2">Refresh in</div>
            <div id="countdown" class="text-4xl font-bold tabular-nums">20</div>
            <a href="dashboard.html" class="mt-8 inline-flex items-center gap-2 rounded-lg border border-slate-600 hover:bg-slate-700 text-white px-4 py-2 text-sm font-medium">
                <i data-lucide="x" class="w-4 h-4"></i> End session
            </a>
        </div>
    </div>

    <div class="mt-8 flex items-center justify-between text-sm text-slate-400">
        <div>38 students marked present so far</div>
        <a href="session_live.html" class="text-brand-400 hover:text-brand-300 inline-flex items-center gap-1">
            <i data-lucide="activity" class="w-4 h-4"></i> View live attendance
        </a>
    </div>
</div>

<script>
    lucide.createIcons();
    let n = 20;
    const cd = document.getElementById('countdown');
    setInterval(() => {
        n--;
        if (n <= 0) n = 20;
        cd.textContent = n;
    }, 1000);
</script>
</body>
</html>
