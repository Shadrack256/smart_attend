<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start session · Smart Attend</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f5bff'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-weight='bold'>S</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    tailwind.config = { theme: { extend: {
        colors: { brand: { 50:'#eef4ff',100:'#dbe7ff',200:'#bcd0ff',300:'#8eb0ff',400:'#5885ff',500:'#2f5bff',600:'#1a3ff0',700:'#152fd0',800:'#182ba8',900:'#1a2b85' } },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
        boxShadow: { card: '0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10)' },
    }}}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

<div class="max-w-2xl mx-auto p-4 sm:p-6 lg:p-8">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Start a session</h1>
            <p class="text-sm text-slate-500 mt-1">Select a course. Your location will be captured for geofencing.</p>
        </div>
        <a href="dashboard.html" class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
        </a>
    </div>

    <form onsubmit="alert('Session would start and go to display_qr.html'); return false;">
        <div class="bg-white rounded-xl border border-slate-200 shadow-card">
            <div class="p-6 space-y-5">

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Course</label>
                    <select class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option>CSC101 — Introduction to Computer Science</option>
                        <option>CSC201 — Data Structures &amp; Algorithms</option>
                        <option>CSC301 — Database Systems</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Geofence radius (meters)</label>
                    <input type="number" value="100" min="20" max="1000"
                           class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div class="flex items-start gap-3 rounded-lg border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-800">
                    <i data-lucide="map-pin" class="w-5 h-5 shrink-0 mt-0.5"></i>
                    <div>
                        <div class="font-medium">Location captured</div>
                        <div class="text-sky-700 text-xs mt-0.5">-1.2921, 36.8219 · ±12 m accuracy</div>
                    </div>
                </div>

            </div>

            <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-3">
                <a href="dashboard.html" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
                <a href="display_qr.html" class="inline-flex items-center gap-2 rounded-lg bg-brand-600 text-white px-4 py-2 text-sm font-semibold hover:bg-brand-700 shadow-sm">
                    <i data-lucide="play" class="w-4 h-4"></i> Start session
                </a>
            </div>
        </div>
    </form>

</div>
<script>lucide.createIcons();</script>
</body>
</html>
