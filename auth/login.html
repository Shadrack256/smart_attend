<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Smart Attend</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f5bff'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-weight='bold'>S</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    tailwind.config = {
        theme: { extend: {
            colors: { brand: { 50:'#eef4ff',100:'#dbe7ff',200:'#bcd0ff',300:'#8eb0ff',400:'#5885ff',500:'#2f5bff',600:'#1a3ff0',700:'#152fd0',800:'#182ba8',900:'#1a2b85' } },
            fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
            boxShadow: { card: '0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10)' },
        }}
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

<div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <a href="../index.html" class="inline-block">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 text-white font-bold text-xl mb-4">S</div>
            </a>
            <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
            <p class="text-sm text-slate-500 mt-1">Sign in to Smart Attend</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-card p-8">

            <!-- Demo error (hidden by default) -->
            <div id="error" class="hidden mb-5 flex items-start gap-3 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
                <i data-lucide="alert-circle" class="w-5 h-5 mt-0.5 shrink-0"></i>
                <div>Invalid email or password.</div>
            </div>

            <form id="loginForm" class="space-y-4" onsubmit="return fakeLogin(event)">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                    <input name="email" type="email" required autofocus value="admin@smartattend.local"
                           class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <input name="password" type="password" required value="admin123"
                           class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                </div>
                <button class="w-full rounded-lg bg-brand-600 text-white py-2.5 text-sm font-semibold hover:bg-brand-700 shadow-sm transition">
                    Sign in
                </button>
            </form>

            <!-- Quick demo shortcuts (remove in production) -->
            <div class="mt-6 pt-6 border-t border-slate-100">
                <p class="text-xs text-slate-400 mb-3 text-center">Demo shortcuts</p>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <a href="../admin/dashboard.html"   class="text-center rounded-lg border border-slate-200 py-2 text-slate-700 hover:bg-slate-50">Admin</a>
                    <a href="../lecturer/dashboard.html" class="text-center rounded-lg border border-slate-200 py-2 text-slate-700 hover:bg-slate-50">Lecturer</a>
                    <a href="../student/dashboard.html"  class="text-center rounded-lg border border-slate-200 py-2 text-slate-700 hover:bg-slate-50">Student</a>
                </div>
            </div>

            <p class="mt-6 text-center text-sm text-slate-500">
                Don't have an account?
                <a href="register.html" class="font-medium text-brand-600 hover:text-brand-700">Create one</a>
            </p>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    function fakeLogin(e) {
        e.preventDefault();
        // In the real app this posts to login.php.
        // For the demo, just go to the admin dashboard.
        window.location.href = '../admin/dashboard.html';
        return false;
    }
</script>
</body>
</html>
